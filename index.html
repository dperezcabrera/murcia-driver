<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111817" />
    <meta name="description" content="Conduce por el centro real de Murcia. Un prototipo 3D de conducción, persecuciones y misiones en el navegador." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- The cover goes first: it is small, and it is what the player sees while the city data (megabytes) loads. -->
    <link rel="preload" as="image" href="./assets/cover-pimenton.webp" type="image/webp" fetchpriority="high" />
    <title>Murcia Driver</title>
    <style>
      /* Loading cover, inline so it shows before the game's script and stylesheet arrive. */
      html,body{margin:0;background:#111817}
      .cover{position:fixed;inset:0;z-index:1000;display:flex;align-items:flex-end;background:#111817;color:#f7f5e9;font-family:'Barlow',Arial,sans-serif;transition:opacity .6s ease}
      .cover-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
      .cover::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#0b1312f2 0%,#0b1312c7 32%,#0b131240 62%,#0b131226 100%)}
      .cover-content{position:relative;z-index:1;width:min(560px,100%);padding:0 7% 9vh;box-sizing:content-box}
      .cover-eyebrow{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:3px;color:#d6f16d}
      .cover-title{margin:0 0 32px;font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-size:clamp(56px,9vw,120px);line-height:.88;font-weight:700;letter-spacing:1px}
      .cover .load-status{width:min(420px,100%);min-height:56px;font-size:13px;color:#d7dccf}
      .cover .load-track{height:3px;background:#ffffff2e;margin-bottom:10px}
      .cover .load-track span{display:block;height:100%;width:3%;background:#d6f16d;transition:width .2s}
      .cover.done{opacity:0;pointer-events:none}
      @media(max-width:650px){.cover-content{padding:0 24px 12vh}}
      @media(prefers-reduced-motion:reduce){.cover,.cover .load-track span{transition:none}}
    </style>
    <!-- Visit counts with GoatCounter: no cookies, no personal data. -->
    <script data-goatcounter="https://dperezcabrera.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
    <script type="module" crossorigin src="./assets/index-CZsca5t-.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CwldiECQ.css">
  </head>
  <body>
    <section id="cover" class="cover" aria-labelledby="cover-title">
      <img class="cover-image" src="./assets/cover-pimenton.webp" width="1280" height="720" alt="" fetchpriority="high" />
      <div class="cover-content">
        <p class="cover-eyebrow">DRIVING STORIES</p>
        <h1 id="cover-title" class="cover-title">MURCIA<br />DRIVER</h1>
        <div id="load-status" class="load-status" role="status"><div class="load-track"><span id="load-bar"></span></div><span id="load-label">Cargando el mapa real de la ciudad…</span> <button id="retry-button" class="text-button" hidden>Volver a cargar</button></div>
      </div>
    </section>
    <div id="app" inert></div>
  </body>
</html>
